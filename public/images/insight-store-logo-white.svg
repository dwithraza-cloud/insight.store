<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 88" fill="none">
  <!-- ICON MARK (Left) in White -->
  <g transform="translate(4, 0)">
    <!-- Top Square (Dot) -->
    <rect x="8" y="6" width="25" height="25" fill="#ffffff" rx="1.5" />
    
    <!-- L-Shaped Body with Rounded Bottom-Left Corner -->
    <path 
      d="M 8 37 
         H 33 
         V 62 
         H 68 
         V 87 
         H 33 
         A 25 25 0 0 1 8 62 
         Z" 
      fill="#ffffff" 
    />
    
    <!-- Inner White Square with clean negative space boundary -->
    <rect x="39" y="37" width="28" height="25" fill="#ffffff" rx="1.5" />
  </g>

  <!-- WORDMARK (Right) in White -->
  <g transform="translate(94, 0)">
    <!-- Line 1: "insight" -->
    <text 
      x="0" 
      y="43" 
      font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" 
      font-size="44" 
      font-weight="800" 
      letter-spacing="-0.035em" 
      fill="#ffffff"
    >
      insight
    </text>
    
    <!-- White square dot on the first 'i' in insight -->
    <rect x="0" y="8" width="10.5" height="10.5" fill="#ffffff" rx="1" />

    <!-- Line 2: "store" -->
    <text 
      x="0" 
      y="84" 
      font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" 
      font-size="44" 
      font-weight="800" 
      letter-spacing="-0.035em" 
      fill="#ffffff"
    >
      store
    </text>
  </g>
</svg>
